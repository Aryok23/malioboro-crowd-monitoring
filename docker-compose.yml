services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: malioboro-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/cameras')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Fully stateless backend (no DB, no disk-persisted alerts/frames) — no
    # volumes needed. Only frontend env vars in .env are ignored here.
